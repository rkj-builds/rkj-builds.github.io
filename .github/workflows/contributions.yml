name: Refresh contribution grid
on:
  schedule: [{ cron: "30 0 * * *" }]   # 06:00 IST daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the last year of contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='query{user(login:"rkj-builds"){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{date contributionCount}}}}}}' \
            --jq '.data.user.contributionsCollection.contributionCalendar | {total:.totalContributions, days:[.weeks[].contributionDays[] | [.date,.contributionCount]]}' > data/contributions.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json
          git diff --cached --quiet || git commit -m "Refresh contribution grid"
          git push
